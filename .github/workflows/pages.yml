name: Deploy docs/ to GitHub Pages

# The site is plain ES modules + three.js and ONNX Runtime from a CDN, so
# there is nothing to build: docs/ is uploaded as-is. Its data assets are
# regenerated by scripts/export_web_assets.py, export_web_data.py and
# export_onnx.py, which need MuJoCo and the checkpoint and so are run
# locally, not here.

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
