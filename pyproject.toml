[project]
name = "interactive-lamp"
version = "0.1.0"
description = "LeLamp MJCF simulation"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=0.121.0",
    "google-genai>=2.17.0",
    "matplotlib>=3.10.9",
    "mujoco>=3.2",
    "numpy>=1.26",
    "pillow>=12.3.0",
    "scipy>=1.15.3",
    "sounddevice>=0.5.5",
    "torch>=2.5",
]

[tool.uv]
package = false
# pyopengl 3.1.10's wheel ships without OpenGL/version.py, which breaks
# mujoco's EGL/OSMesa rendering with a confusing missing-Renderer
# AttributeError (mujoco swallows the ImportError); 3.1.9 is fine
constraint-dependencies = ["pyopengl==3.1.9"]

# torch pinned to the CPU wheel locally (inference/demo box); train on
# the GPU box with a CUDA build instead (see motion_generator/README.md)
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[dependency-groups]
dev = [
    "imageio>=2.37.4",
    "imageio-ffmpeg>=0.6.0",
    "pytest>=9.1.1",
]
voice = [
    "faster-whisper>=1.2.1",
]
