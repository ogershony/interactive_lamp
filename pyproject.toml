[project]
name = "interactive-lamp"
version = "0.1.0"
description = "LeLamp MJCF simulation"
requires-python = ">=3.10"
dependencies = [
    "matplotlib>=3.10.9",
    "mujoco>=3.2",
    "numpy>=1.26",
    "pillow>=12.3.0",
    "scipy>=1.15.3",
    "torch>=2.5",
]

[tool.uv]
package = false

# torch pinned to the CPU wheel locally (inference/demo box); train on
# the GPU box with a CUDA build instead (see motion_prior/README.md)
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
